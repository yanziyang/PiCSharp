<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">PiCSharp architecture</title>
  <desc id="desc">Architecture overview showing the CLI, agent core, AI providers, protocol, client, server, terminal UI, and terminal input and output.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091020"/>
      <stop offset="0.55" stop-color="#101c34"/>
      <stop offset="1" stop-color="#15304a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a47"/>
      <stop offset="1" stop-color="#111d35"/>
    </linearGradient>
    <linearGradient id="coreCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203b5b"/>
      <stop offset="1" stop-color="#17264a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8bdcf5" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72dff3"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7895b7"/>
    </marker>
  </defs>

  <rect width="1600" height="760" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1598" height="758" rx="27" fill="url(#grid)" stroke="#67e8f9" stroke-opacity="0.18"/>
  <circle cx="1450" cy="-35" r="300" fill="#67e8f9" fill-opacity="0.055"/>
  <circle cx="130" cy="725" r="260" fill="#8b7cff" fill-opacity="0.05"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="80" y="68" fill="#9cecf8" font-size="14" font-weight="700" letter-spacing="2.6">PI CSHARP  /  SYSTEM ARCHITECTURE</text>
    <text x="80" y="116" fill="#f5f9ff" font-size="39" font-weight="700" letter-spacing="-0.8">A native .NET path through Pi</text>
    <text x="80" y="148" fill="#93a9c5" font-size="18">The compatibility layers that connect the interactive agent to providers and the terminal.</text>
  </g>

  <!-- top layer -->
  <g filter="url(#shadow)" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="80" y="186" width="300" height="132" rx="18" fill="url(#card)" stroke="#67e8f9" stroke-opacity="0.38"/>
    <rect x="448" y="176" width="362" height="152" rx="20" fill="url(#coreCard)" stroke="#67e8f9" stroke-opacity="0.72"/>
    <rect x="888" y="186" width="632" height="132" rx="18" fill="url(#card)" stroke="#8b7cff" stroke-opacity="0.55"/>
  </g>
  <!-- Draw the top connection endpoints over the card borders so the handoffs are unambiguous. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 380 244 H 448" stroke="#72dff3" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 810 244 H 888" stroke="#72dff3" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 630 318 V 391" stroke="#72dff3" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- CLI icon -->
  <g transform="translate(108 214)" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect width="54" height="46" rx="10" fill="#67e8f9" fill-opacity="0.1"/>
    <path d="M 14 16 L 23 23 L 14 30"/>
    <path d="M 29 31 H 41"/>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="182" y="232" fill="#dff9ff" font-size="13" font-weight="700" letter-spacing="1.8">ENTRYPOINT</text>
    <text x="182" y="263" fill="#ffffff" font-size="19" font-weight="700">Pi CLI / Coding Agent</text>
    <text x="108" y="295" fill="#9db2cc" font-size="15">Interactive command surface</text>
  </g>

  <!-- agent core icon -->
  <g transform="translate(480 207)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect width="62" height="62" rx="16" fill="#67e8f9" fill-opacity="0.12" stroke="#67e8f9"/>
    <path d="M 31 14 V 8"/>
    <circle cx="31" cy="6" r="2.5" fill="#67e8f9" stroke="none"/>
    <rect x="16" y="21" width="30" height="24" rx="7"/>
    <circle cx="25" cy="33" r="2.5" fill="#67e8f9" stroke="none"/>
    <circle cx="37" cy="33" r="2.5" fill="#67e8f9" stroke="none"/>
    <path d="M 25 41 H 37"/>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="570" y="220" fill="#b9f5ff" font-size="13" font-weight="700" letter-spacing="1.8">ORCHESTRATION</text>
    <text x="570" y="255" fill="#ffffff" font-size="28" font-weight="700">Pi.AgentCore</text>
    <text x="570" y="286" fill="#bdd1e7" font-size="15">State  ·  tools  ·  sessions  ·  agent loop</text>
  </g>

  <!-- AI provider layer -->
  <g transform="translate(920 212)" fill="none" stroke="#b8aaff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="25" cy="25" r="23" fill="#8b7cff" fill-opacity="0.15"/>
    <path d="M 25 12 L 34 19 V 31 L 25 38 L 16 31 V 19 Z"/>
    <path d="M 19 24 H 31 M 25 18 V 30"/>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="982" y="220" fill="#d5ceff" font-size="13" font-weight="700" letter-spacing="1.8">UNIFIED AI LAYER</text>
    <text x="982" y="253" fill="#ffffff" font-size="27" font-weight="700">Pi.Ai</text>
    <text x="982" y="281" fill="#bdd1e7" font-size="15">One contract for provider families</text>
  </g>
  <g transform="translate(1230 207)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">
    <rect width="86" height="30" rx="15" fill="#67e8f9" fill-opacity="0.1" stroke="#67e8f9" stroke-opacity="0.46"/>
    <text x="43" y="20" text-anchor="middle" fill="#b9f5ff">Anthropic</text>
    <rect x="94" width="80" height="30" rx="15" fill="#8b7cff" fill-opacity="0.13" stroke="#8b7cff" stroke-opacity="0.5"/>
    <text x="134" y="20" text-anchor="middle" fill="#d5ceff">OpenAI</text>
    <rect x="184" width="86" height="30" rx="15" fill="#67e8f9" fill-opacity="0.1" stroke="#67e8f9" stroke-opacity="0.46"/>
    <text x="227" y="20" text-anchor="middle" fill="#b9f5ff">Google AI</text>
    <rect x="94" y="38" width="80" height="30" rx="15" fill="#8b7cff" fill-opacity="0.13" stroke="#8b7cff" stroke-opacity="0.5"/>
    <text x="134" y="58" text-anchor="middle" fill="#d5ceff">Mistral</text>
    <rect x="184" y="38" width="86" height="30" rx="15" fill="#67e8f9" fill-opacity="0.1" stroke="#67e8f9" stroke-opacity="0.46"/>
    <text x="227" y="58" text-anchor="middle" fill="#b9f5ff">Bedrock</text>
  </g>

  <!-- service layer label -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="80" y="373" fill="#7895b7" font-size="13" font-weight="700" letter-spacing="2.4">SERVICE AND WIRE FOUNDATIONS</text>
    <path d="M 355 368 H 1520" stroke="#7895b7" stroke-opacity="0.25"/>
  </g>

  <!-- service cards -->
  <g filter="url(#shadow)" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="140" y="391" width="330" height="135" rx="18" fill="url(#card)" stroke="#67e8f9" stroke-opacity="0.42"/>
    <rect x="560" y="391" width="300" height="135" rx="18" fill="url(#card)" stroke="#7895b7" stroke-opacity="0.52"/>
    <rect x="950" y="391" width="300" height="135" rx="18" fill="url(#card)" stroke="#7895b7" stroke-opacity="0.52"/>
  </g>

  <!-- protocol icon -->
  <g transform="translate(168 421)" fill="none" stroke="#67e8f9" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <rect width="52" height="52" rx="14" fill="#67e8f9" fill-opacity="0.1"/>
    <path d="M 15 18 H 37 M 15 27 H 37 M 15 36 H 28"/>
    <path d="M 37 33 L 42 38 L 37 43"/>
  </g>
  <text x="238" y="434" fill="#b9f5ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">WIRE CONTRACT</text>
  <text x="238" y="468" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="700">Pi.Protocol</text>
  <text x="168" y="500" fill="#9db2cc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">CBOR framing  ·  schemas  ·  byte compatibility</text>

  <!-- client icon -->
  <g transform="translate(588 421)" fill="none" stroke="#a9bed8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <rect width="52" height="52" rx="14" fill="#7895b7" fill-opacity="0.12"/>
    <path d="M 17 18 H 35 V 38 H 17 Z"/>
    <path d="M 22 24 H 30 M 22 30 H 30"/>
  </g>
  <text x="658" y="434" fill="#b8c8dd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">CLIENT SURFACE</text>
  <text x="658" y="468" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="700">Pi.Client</text>
  <text x="588" y="500" fill="#9db2cc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Session leases  ·  protocol client</text>

  <!-- server icon -->
  <g transform="translate(978 421)" fill="none" stroke="#a9bed8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <rect width="52" height="52" rx="14" fill="#7895b7" fill-opacity="0.12"/>
    <rect x="15" y="15" width="22" height="9" rx="2"/>
    <rect x="15" y="29" width="22" height="9" rx="2"/>
    <circle cx="20" cy="19.5" r="1.2" fill="#a9bed8" stroke="none"/>
    <circle cx="20" cy="33.5" r="1.2" fill="#a9bed8" stroke="none"/>
  </g>
  <text x="1048" y="434" fill="#b8c8dd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">SERVICE SURFACE</text>
  <text x="1048" y="468" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="700">Pi.Server</text>
  <text x="978" y="500" fill="#9db2cc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Live dispatch  ·  ownership  ·  attachments</text>

  <!-- TUI layer -->
  <g filter="url(#shadow)" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="210" y="575" width="1170" height="118" rx="20" fill="url(#coreCard)" stroke="#67e8f9" stroke-opacity="0.65"/>
  </g>
  <!-- Draw the lower connection endpoints over the TUI border so they remain visibly connected. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 630 526 V 575" stroke="#7895b7" stroke-width="3" marker-end="url(#arrowMuted)"/>
    <path d="M 305 526 V 550 Q 305 575 330 575" stroke="#7895b7" stroke-width="3" marker-end="url(#arrowMuted)"/>
    <path d="M 1100 526 V 550 Q 1100 575 1075 575" stroke="#7895b7" stroke-width="3" marker-end="url(#arrowMuted)"/>
    <path d="M 1380 638 H 1422" stroke="#72dff3" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(246 608)" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect width="58" height="54" rx="14" fill="#67e8f9" fill-opacity="0.1"/>
    <path d="M 15 18 L 24 25 L 15 32"/>
    <path d="M 30 34 H 43"/>
    <path d="M 43 18 V 32"/>
  </g>
  <text x="330" y="612" fill="#b9f5ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">INTERACTIVE SURFACE</text>
  <text x="330" y="647" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="700">Pi.Tui</text>
  <text x="330" y="674" fill="#bdd1e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Input  ·  layout  ·  text measurement  ·  differential rendering</text>
  <g transform="translate(930 604)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600">
    <rect width="184" height="38" rx="19" fill="#67e8f9" fill-opacity="0.1" stroke="#67e8f9" stroke-opacity="0.48"/>
    <text x="92" y="25" text-anchor="middle" fill="#b9f5ff">terminal input</text>
    <rect x="198" width="184" height="38" rx="19" fill="#8b7cff" fill-opacity="0.13" stroke="#8b7cff" stroke-opacity="0.5"/>
    <text x="290" y="25" text-anchor="middle" fill="#d5ceff">terminal output</text>
  </g>
  <text x="930" y="672" fill="#7f96b5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" letter-spacing="1.2">NATIVE CONSOLE / ANSI STREAM</text>

  <!-- Terminal destination for the ANSI stream. -->
  <g filter="url(#shadow)" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="1430" y="594" width="120" height="90" rx="16" fill="url(#card)" stroke="#67e8f9" stroke-opacity="0.5"/>
  </g>
  <g transform="translate(1446 615)" fill="none" stroke="#67e8f9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect width="38" height="30" rx="6" fill="#67e8f9" fill-opacity="0.1"/>
    <path d="M 9 11 L 15 16 L 9 21"/>
    <path d="M 20 22 H 29"/>
  </g>
  <text x="1494" y="632" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">Terminal</text>
  <text x="1446" y="666" fill="#8ddfeb" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ANSI STREAM</text>

  <!-- directional labels -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.8" text-anchor="middle">
    <text x="414" y="224" fill="#8ddfeb">HANDOFF</text>
    <text x="849" y="224" fill="#b8aaff">PROVIDER API</text>
    <text x="646" y="367" fill="#8ddfeb">MESSAGES</text>
    <text x="1400" y="628" fill="#8ddfeb">ANSI</text>
  </g>

  <g transform="translate(80 725)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">
    <circle cx="5" cy="5" r="5" fill="#67e8f9" filter="url(#softGlow)"/>
    <text x="18" y="10" fill="#8ca4c2">Compatibility boundary</text>
    <circle cx="180" cy="5" r="5" fill="#7895b7"/>
    <text x="193" y="10" fill="#8ca4c2">Runtime foundation</text>
  </g>
</svg>
