</defs><rect x="0" y="0" width="1200" height="4" fill="#4f46e5"/><text x="40" y="50" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">The Binding Constraint — How Pi Extensions Actually Execute</text><text x="40" y="73" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.4" font-weight="400" fill="#64748b" text-anchor="start">Extensions are in-process TypeScript with full Node.js access, not a serialisable wire protocol. Any .NET port must reproduce this.</text><rect x="40" y="100" width="1120" height="212" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/><text x="56" y="121" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#3178c6" text-anchor="start" letter-spacing="1.1">EXECUTION PATH TODAY</text><rect x="60" y="142" width="236" height="74" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-typescript" x="73" y="166" width="24" height="24" style="color:#3178c6"/><text x="108" y="178" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.4" font-weight="650" fill="#0f172a" text-anchor="start">extension.ts</text><text x="108" y="193" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.6" font-weight="400" fill="#64748b" text-anchor="start">export default (pi) =&gt; …</text><text x="60" y="244" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.6" font-weight="400" fill="#64748b" text-anchor="start">85 bundled examples in-repo;</text><text x="60" y="260" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.6" font-weight="400" fill="#64748b" text-anchor="start">50+ community packages</text><path d="M304 179H340" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d2-ar)" fill="none"/><rect x="348" y="142" width="206" height="74" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-gear" x="361" y="166" width="24" height="24" style="color:#d97706"/><text x="396" y="178" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.4" font-weight="650" fill="#0f172a" text-anchor="start">jiti</text><text x="396" y="193" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.6" font-weight="400" fill="#64748b" text-anchor="start">runtime TS transpile</text><text x="348" y="244" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.6" font-weight="400" fill="#64748b" text-anchor="start">No build step. No sandbox.</text><path d="M562 179H598" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d2-ar)" fill="none"/><rect x="606" y="142" width="240" height="74" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-nodejs" x="619" y="166" width="24" height="24" style="color:#4b8b3b"/><text x="654" y="178" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.4" font-weight="650" fill="#0f172a" text-anchor="start">Same Node process</text><text x="654" y="193" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.6" font-weight="400" fill="#64748b" text-anchor="start">shared heap · live objects</text><text x="606" y="244" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.6" font-weight="400" fill="#64748b" text-anchor="start">Direct object references, not copies.</text><path d="M854 179H890" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d2-ar)" fill="none"/><rect x="898" y="142" width="242" height="74" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-plugin" x="911" y="166" width="24" height="24" style="color:#7c3aed"/><text x="946" y="178" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.4" font-weight="650" fill="#0f172a" text-anchor="start">ExtensionAPI</text><text x="946" y="193" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.6" font-weight="400" fill="#64748b" text-anchor="start">157 exported types</text><text x="898" y="244" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.6" font-weight="400" fill="#64748b" text-anchor="start">27 event types · 6 registration APIs</text><rect x="40" y="330" width="548" height="190" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/><text x="56" y="351" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#7c3aed" text-anchor="start" letter-spacing="1.1">WHAT AN EXTENSION RECEIVES (live references)</text><rect x="58" y="364" width="512" height="32" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-layers" x="71" y="372" width="16" height="16" style="color:#7c3aed"/><text x="98" y="384.2" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.6" font-weight="650" fill="#0f172a" text-anchor="start">TUI instance — render custom components</text><rect x="58" y="402" width="512" height="32" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-terminal" x="71" y="410" width="16" height="16" style="color:#7c3aed"/><text x="98" y="422.2" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.6" font-weight="650" fill="#0f172a" text-anchor="start">SessionManager — mutate the session tree</text><rect x="58" y="440" width="512" height="32" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-llm" x="71" y="448" width="16" height="16" style="color:#7c3aed"/><text x="98" y="460.2" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.6" font-weight="650" fill="#0f172a" text-anchor="start">ModelRegistry — resolve provider credentials</text><rect x="58" y="478" width="512" height="32" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-code" x="71" y="486" width="16" height="16" style="color:#7c3aed"/><text x="98" y="498.2" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.6" font-weight="650" fill="#0f172a" text-anchor="start">AbortSignal + callbacks — function references</text><rect x="612" y="330" width="548" height="190" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/><text x="628" y="351" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#4b8b3b" text-anchor="start" letter-spacing="1.1">AND THE FULL NODE.JS SURFACE</text><rect x="630" y="364" width="512" height="32" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-package" x="643" y="372" width="16" height="16" style="color:#4b8b3b"/><text x="670" y="384.2" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.6" font-weight="650" fill="#0f172a" text-anchor="start">node:fs, node:path, node:os — filesystem access</text><rect x="630" y="402" width="512" height="32" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-gear" x="643" y="410" width="16" height="16" style="color:#4b8b3b"/><text x="670" y="422.2" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.6" font-weight="650" fill="#0f172a" text-anchor="start">node:child_process — spawn arbitrary processes</text><rect x="630" y="440" width="512" height="32" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-code" x="643" y="448" width="16" height="16" style="color:#4b8b3b"/><text x="670" y="460.2" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.6" font-weight="650" fill="#0f172a" text-anchor="start">node:zlib, node:readline, node:module — internals</text><rect x="630" y="478" width="512" height="32" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#d2-sh)"/><use href="#d2-i-npm" x="643" y="486" width="16" height="16" style="color:#4b8b3b"/><text x="670" y="498.2" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.6" font-weight="650" fill="#0f172a" text-anchor="start">arbitrary npm dependencies — typebox, ms, …</text><rect x="40" y="538" width="1120" height="244" rx="12" fill="#fefefe" stroke="#e2e8f0" stroke-width="1.3"/><text x="56" y="559" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="start" letter-spacing="1.1">WHAT SURVIVES A PROCESS / LANGUAGE BOUNDARY?</text><use href="#d2-i-check-circle" x="58" y="561" width="18" height="18" style="color:#059669"/><text x="84" y="574" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Event notifications (session, turn, message, tool lifecycle)</text><text x="690" y="574" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">JSON-serialisable — portable over RPC</text><use href="#d2-i-check-circle" x="58" y="591" width="18" height="18" style="color:#059669"/><text x="84" y="604" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Tool registration and execution results</text><text x="690" y="604" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">already schema-described via typebox</text><use href="#d2-i-check-circle" x="58" y="621" width="18" height="18" style="color:#059669"/><text x="84" y="634" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">ctx.ui.confirm / select / input / notify dialogs</text><text x="690" y="634" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">portable with a UI request–response protocol</text><use href="#d2-i-check-circle" x="58" y="651" width="18" height="18" style="color:#059669"/><text x="84" y="664" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">UI components — the contract is render(width) ⇒ string[]</text><text x="690" y="664" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">extensions emit styled lines, not a widget tree</text><use href="#d2-i-warning" x="58" y="681" width="18" height="18" style="color:#d97706"/><text x="84" y="694" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Mutating event.input in place to rewrite tool arguments</text><text x="690" y="694" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">needs an explicit round-trip contract; semantics change</text><use href="#d2-i-warning" x="58" y="711" width="18" height="18" style="color:#d97706"/><text x="84" y="724" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Editor replacement and high-frequency component renders</text><text x="690" y="724" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">cross a boundary, but per-frame IPC latency degrades them</text><use href="#d2-i-x-circle" x="58" y="741" width="18" height="18" style="color:#dc2626"/><text x="84" y="754" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">node:fs / node:child_process / npm dependencies</text><text x="690" y="754" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">requires a real Node.js runtime, not a JS interpreter</text><line x1="58" y1="770" x2="1142" y2="770" stroke="#e2e8f0"/><text x="58" y="792" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.4" font-weight="600" fill="#0f172a" text-anchor="start">Measured on the repo's own 85 bundled extensions:</text><text x="348" y="792" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.4" font-weight="600" fill="#d97706" text-anchor="start">41% (35) render UI components  ·  58% (49) use dialogs  ·  26% (22) call Node built-ins — only the last is a hard blocker.</text></svg>